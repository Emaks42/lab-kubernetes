apiVersion: v1
kind: PersistentVolume
metadata:
  name: s3-pv-lab-uploads
  namespace: lab-kuber
spec:
  storageClassName: standard
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - allow-delete
    - region=app
    - url=https://localhost:9000
    - use_path_request_style
  csi:
    driver: ru.yandex.s3.csi
    volumeHandle: messager-uploads-volume
    nodePublishSecretRef:
      name: csi-s3-secret
      namespace: lab-kuber
    volumeAttributes:
      bucketName: messager-uploads
      mounter: rclone
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: message-uploads-pvc
  namespace: lab-kuber
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: s3-pv-lab-uploads